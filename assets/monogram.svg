<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <!-- Outer Gold Laurel Ring -->
  <circle cx="120" cy="120" r="105" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/>
  <circle cx="120" cy="120" r="95" stroke="#D4AF37" stroke-width="0.8" opacity="0.4"/>
  
  <!-- Subtle decorative accents -->
  <polygon points="120,10 124,18 120,26 116,18" fill="#D4AF37"/>
  <polygon points="120,214 124,222 120,230 116,222" fill="#D4AF37"/>
  <polygon points="10,120 18,124 26,120 18,116" fill="#D4AF37"/>
  <polygon points="214,120 222,124 230,120 222,116" fill="#D4AF37"/>

  <!-- Monogram K & S (Kevin & Sovia) -->
  <text x="104" y="132" font-family="'Cormorant Garamond', serif" font-size="64" font-weight="300" fill="#D4AF37" text-anchor="middle">K</text>
  <text x="120" y="125" font-family="'Great Vibes', cursive" font-size="44" fill="#8A9A86" text-anchor="middle">&amp;</text>
  <text x="139" y="138" font-family="'Cormorant Garamond', serif" font-size="64" font-weight="300" fill="#B89047" text-anchor="middle">S</text>
  
  <text x="120" y="165" font-family="'Cinzel', serif" font-size="9" letter-spacing="3" fill="#2C2C2C" opacity="0.6" text-anchor="middle">26 . 12 . 2026</text>
</svg>
